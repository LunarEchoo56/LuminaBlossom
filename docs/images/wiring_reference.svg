<text x="510" y="307" font-family="Arial,sans-serif" font-size="18" fill="#69441f">5 V logic-level shifter</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#593819"><text x="510" y="357">A input ← GP16</text><text x="510" y="405">Y output → LED DIN</text><text x="510" y="453">VCC → 5 V</text><text x="510" y="489">GND and /OE → GND</text></g>
