<text x="90" y="637" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#654b16">Important</text>
<text x="90" y="666" font-family="Arial,sans-serif" font-size="17" fill="#654b16">All grounds must be common. Use one buffer channel; tie active-low /OE low. Confirm the actual 74AHCT125 package pinout.</text>
<text x="90" y="689" font-family="Arial,sans-serif" font-size="16" fill="#654b16">Illustrative connection guide, not a KiCad schematic or PCB layout. Follow component datasheets before powering.</text>
