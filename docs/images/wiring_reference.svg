<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770">
<rect width="1280" height="770" fill="#f7f9fc"/>
<text x="52" y="55" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#172a43">LuminaBlossom — carrier-board wiring</text>
<text x="52" y="91" font-family="Arial,sans-serif" font-size="19" fill="#52637a">Pico 2 W → 74AHCT125N → 330 Ω → NeoPixel ring DIN</text>
<rect x="55" y="155" width="300" height="330" rx="18" fill="#eaf1fb" stroke="#315b92" stroke-width="3"/>
<text x="87" y="197" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1d426b">Pico 2 W</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#1b2b40"><text x="87" y="260">Pin 40: VBUS (5 V)</text><text x="87" y="315">Pin 38: GND</text><text x="87" y="370">GP16 / pin 21: DATA</text></g>
<rect x="430" y="190" width="260" height="240" rx="18" fill="#fff2e3" stroke="#c18448" stroke-width="3"/>
<text x="466" y="232" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7e4b1e">U1: SN74AHCT125N</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#593819"><text x="466" y="284">Pin 2 (1A) ← GP16</text><text x="466" y="326">Pin 3 (1Y) → R1</text><text x="466" y="368">Pin 14 (VCC) → +5 V</text><text x="466" y="410">Pin 7 (GND) → common GND</text></g>
<rect x="760" y="235" width="155" height="100" rx="14" fill="#f3e7fb" stroke="#9462bb" stroke-width="3"/>
<text x="795" y="273" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#65358a">R1 330 Ω</text><text x="780" y="303" font-family="Arial,sans-serif" font-size="16" fill="#65358a">Series data resistor</text>
<rect x="970" y="175" width="260" height="300" rx="18" fill="#eaf8ed" stroke="#438250" stroke-width="3"/>
<text x="1007" y="216" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#285a34">J3 LED output</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#244421"><text x="1007" y="270">Pin 1: +5 V</text><text x="1007" y="320">Pin 2: GND</text><text x="1007" y="370">Pin 3: LED DIN</text></g>
<path d="M355 260 H385 V368 H430" stroke="#d84c4c" stroke-width="4" fill="none" stroke-linejoin="round"/>
<path d="M355 315 H390 V410 H430" stroke="#252b34" stroke-width="4" fill="none" stroke-linejoin="round"/>
<path d="M355 370 H400 V284 H430" stroke="#2674c7" stroke-width="4" fill="none" stroke-linejoin="round"/>
<path d="M690 326 H725 V285 H760" stroke="#9462bb" stroke-width="4" fill="none" stroke-linejoin="round"/>
<path d="M915 285 H940 V370 H970" stroke="#9462bb" stroke-width="4" fill="none" stroke-linejoin="round"/>
<rect x="55" y="535" width="1175" height="160" rx="15" fill="#ffffff" stroke="#aab8c9" stroke-width="2"/>
<text x="83" y="574" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#273b54">Decoupling and bulk capacitance</text>
<text x="83" y="614" font-family="Arial,sans-serif" font-size="19" fill="#273b54">C1: 100 nF across +5 V and GND close to U1.</text>
<text x="83" y="650" font-family="Arial,sans-serif" font-size="19" fill="#273b54">C2: 470 µF / 10 V across +5 V and GND near J3; positive lead goes to +5 V.</text>
<text x="83" y="681" font-family="Arial,sans-serif" font-size="17" fill="#52637a">All grounds common. Illustrative wiring reference, not a KiCad PCB render. Verify pinouts and power capacity before connecting.</text>
</svg>