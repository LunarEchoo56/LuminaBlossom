<text x="100" y="205" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1d426b">Raspberry Pi Pico 2 W</text>
<text x="100" y="242" font-family="Arial,sans-serif" font-size="18" fill="#35455e">Power via Micro-USB</text>
<g font-family="Arial,sans-serif" font-size="21" fill="#1b2b40"><text x="100" y="312">Pin 40 — VBUS (5 V)</text><text x="100" y="370">Pin 38 — GND</text><text x="100" y="428">GP16 — physical pin 21</text></g>
